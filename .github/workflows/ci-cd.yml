name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: 2025
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:

      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # Java 21
      # Gateway + Discovery
      # =========================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build Gateway Service
        working-directory: gateway
        run: mvn clean package -DskipTests

      - name: Build Discovery Service
        working-directory: discovery
        run: mvn clean package -DskipTests

      # =========================
      # Java 17
      # Menu + Order + Payment
      # =========================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build Menu Service
        working-directory: menu
        run: mvn clean package -DskipTests

      - name: Build Order Service
        working-directory: order
        run: mvn clean package -DskipTests

      - name: Build Payment Service
        working-directory: payment
        run: mvn clean package -DskipTests

      # =========================
      # Docker Build
      # =========================

      - name: Build Docker Images
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          docker build \
            -t $DOCKER_USER/restaurant-microservice-discovery:latest \
            ./discovery
          
          docker build \
            -t $DOCKER_USER/restaurant-microservice-gateway:latest \
            ./gateway
          
          docker build \
            -t $DOCKER_USER/restaurant-microservice-menu:latest \
            ./menu
          
          docker build \
            -t $DOCKER_USER/restaurant-microservice-order:latest \
            ./order
          
          docker build \
            -t $DOCKER_USER/restaurant-microservice-payment:latest \
            ./payment

      # =========================
      # Docker Hub Login
      # =========================

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # =========================
      # Push Docker Images
      # =========================

      - name: Push Docker Images
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: |
          docker push $DOCKER_USER/restaurant-microservice-discovery:latest
          docker push $DOCKER_USER/restaurant-microservice-gateway:latest
          docker push $DOCKER_USER/restaurant-microservice-menu:latest
          docker push $DOCKER_USER/restaurant-microservice-order:latest
          docker push $DOCKER_USER/restaurant-microservice-payment:latest

