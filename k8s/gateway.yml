apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: restaurant-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: salah529/restaurant-microservice-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: GATEWAY_MENU_URL
              value: "http://menu-service:8081"

            - name: GATEWAY_ORDER_URL
              value: "http://order-service:8082"

            - name: GATEWAY_PAYMENT_URL
              value: "http://payment-service:8083"

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8888/eureka/"

            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-service:3306/restaurant_user?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_DATASOURCE_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: restaurant-microservice
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
