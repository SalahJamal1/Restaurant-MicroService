apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-deployment
  namespace: restaurant-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: menu
  template:
    metadata:
      labels:
        app: menu
    spec:
      containers:
        - name: menu
          image: salah529/restaurant-microservice-menu:latest
          ports:
            - containerPort: 8081
          env:
            - name: EUREKA_INSTANCE_HOSTNAME
              value: menu-service

            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-service:8888/eureka/
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-service:3306/restaurant_menu?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_DATASOURCE_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: menu-service
  namespace: restaurant-microservice
spec:
  type: ClusterIP
  selector:
    app: menu
  ports:
    - port: 8081
      targetPort: 8081
